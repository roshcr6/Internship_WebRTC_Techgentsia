<!DOCTYPE html>
<html lang="en" data-phase="idle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="V-Rescuer — Fault-tolerant WebRTC video call with AI caption fallback." />
  <title>V-Rescuer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="css/call.css" />
</head>
<body>

<!-- ════════════════════════  LOBBY  ════════════════════════════════════════ -->
<div id="lobby">
  <div class="lobby-card">

    <div class="lobby-header">
      <h1>🛡️ V-Rescuer</h1>
      <p>Fault-Tolerant Video Communication</p>
    </div>

    <div class="lobby-body">
      <p class="lobby-hint">Open this page in two tabs to connect</p>
      <div class="lobby-buttons">
        <button class="btn-lobby btn-caller" id="btn-caller">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 1a9 9 0 0 1 9 9v4a9 9 0 0 1-18 0v-4a9 9 0 0 1 9-9zm0 2a7 7 0 0 0-7 7v4a7 7 0 0 0 14 0v-4a7 7 0 0 0-7-7z"/><path d="M8.5 9a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-1 0v-5a.5.5 0 0 1 .5-.5zm7 0a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-1 0v-5a.5.5 0 0 1 .5-.5z"/></svg>
          Start as Caller (Tab 1)
        </button>
        <button class="btn-lobby btn-callee" id="btn-callee">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
          Join as Callee (Tab 2)
        </button>
      </div>
    </div>

    <div class="lobby-footer">
      <span>BroadcastChannel · WebRTC · Whisper AI</span>
      <a href="admin.html" target="_blank" id="admin-link">Admin Dashboard ↗</a>
    </div>
  </div>
</div>

<!-- ════════════════════════  CALL STAGE  ═══════════════════════════════════ -->
<div id="call-stage">

  <!-- Remote Video (full-screen) -->
  <video id="video-remote" autoplay playsinline></video>

  <!-- Waiting Placeholder -->
  <div id="remote-placeholder">
    <div class="ph-avatar">👤</div>
    <div class="ph-text" id="ph-text">Waiting for peer to join…</div>
  </div>

  <!-- Local PiP Video -->
  <div id="local-pip">
    <video id="video-local" autoplay muted playsinline></video>
  </div>

  <!-- Local speaking indicator -->
  <div id="local-caption"></div>

  <!-- Caption Overlay (shown on critical mode) -->
  <div id="caption-overlay">
    <div class="caption-bar">
      <div class="caption-dot"></div>
      <div class="caption-bar-label">Live AI Transcript</div>
      <div class="caption-bar-tag" id="caption-source-tag">Whisper · DataChannel</div>
    </div>
    <div id="caption-text"></div>
  </div>

  <!-- Controls Bar -->
  <div id="controls">
    <!-- Mic -->
    <button class="ctrl-btn" id="btn-mic" title="Toggle microphone">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-1 13.93A7.001 7.001 0 0 1 5 11H7a5 5 0 0 0 10 0h2a7.001 7.001 0 0 1-6 6.93V20h3v2H8v-2h3v-2.07z"/></svg>
    </button>

    <!-- Camera -->
    <button class="ctrl-btn" id="btn-camera" title="Toggle camera">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>

    <div class="ctrl-spacer"></div>

    <!-- Network badge -->
    <div id="network-badge" data-mode="good">Healthy</div>

    <!-- Call Timer -->
    <div id="call-timer">00:00</div>

    <div class="ctrl-spacer"></div>

    <!-- Admin link -->
    <button class="ctrl-btn" id="btn-admin" title="Open admin panel" onclick="window.open('admin.html','_blank')">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>

    <!-- End Call -->
    <button class="ctrl-btn" id="btn-end" title="End call" disabled>
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/><line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
  </div>

</div>

<!-- ════════════════════════  SCRIPTS  ══════════════════════════════════════ -->
<script src="js/config.js"></script>
<script src="js/signaling.js"></script>
<script src="js/stats-monitor.js"></script>
<script src="js/data-channel.js"></script>
<script src="js/peer-connection.js"></script>
<script src="js/admin-bridge.js"></script>
<script type="module" src="js/speech-engine.js"></script>
<script src="js/app.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

  // ── Mic toggle ────────────────────────────────────────────────────────────
  let micOn = true, camOn = true;
  const btnMic = document.getElementById('btn-mic');
  const btnCam = document.getElementById('btn-camera');

  btnMic.addEventListener('click', () => {
    if (!window.vRescuer?._peerConn?._localStream) return;
    micOn = !micOn;
    window.vRescuer._peerConn._localStream.getAudioTracks()
      .forEach(t => t.enabled = micOn);
    btnMic.classList.toggle('off', !micOn);
    btnMic.title = micOn ? 'Mute mic' : 'Unmute mic';
  });

  btnCam.addEventListener('click', () => {
    if (!window.vRescuer?._peerConn?._localStream) return;
    camOn = !camOn;
    window.vRescuer._peerConn._localStream.getVideoTracks()
      .forEach(t => t.enabled = camOn);
    btnCam.classList.toggle('off', !camOn);
    btnCam.title = camOn ? 'Hide camera' : 'Show camera';
  });

  // ── Lobby → Call transition ───────────────────────────────────────────────
  // This is driven by app.js calling ui.setPhase('connecting')
  // which sets data-phase on body. We watch it here.
  const lobby = document.getElementById('lobby');
  const bodyObs = new MutationObserver(() => {
    const phase = document.body.getAttribute('data-phase');
    lobby.classList.toggle('hidden', phase !== 'idle');
    // Reset mic/cam visual state on new call
    if (phase === 'connecting') { micOn = true; camOn = true; btnMic.classList.remove('off'); btnCam.classList.remove('off'); }
  });
  bodyObs.observe(document.body, { attributes: true, attributeFilter: ['data-phase'] });
});
</script>

</body>
</html>
