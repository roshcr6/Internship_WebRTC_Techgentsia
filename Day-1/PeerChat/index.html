<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>PeerChat</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' href='main.css'>
</head>
<body>

    <div id="connection-status" class="status status-connecting">Connecting...</div>

    <div id="videos">
        <video class="video-player" id="user-1" autoplay playsinline muted></video>
        <video class="video-player" id="user-2" autoplay playsinline></video>
    </div>

    <div id="controls">
        <div class="control-container" id="camera-btn" title="Toggle Camera">
            <img src="icons/camera.svg" alt="Camera" />
        </div>

        <div class="control-container" id="mic-btn" title="Toggle Mic">
            <img src="icons/mic.svg" alt="Mic" />
        </div>

        <a href="lobby.html">
            <div class="control-container" id="leave-btn" title="Leave">
                <img src="icons/phone.svg" alt="Leave" />
            </div>
        </a>
    </div>
    
<script src='agora-rtm-sdk-1.5.1.js'></script>
<script src='main.js'></script>
</body>
</html>
